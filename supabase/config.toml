# Supabase CLI configuration for Tornasol.
# Docs: https://supabase.com/docs/guides/cli/config
#
# `project_id` is a local identifier for this project (used to name the local
# Docker stack). Your REMOTE project is chosen when you run `supabase link`.

project_id = "tornasol"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
# Match Supabase's hosted Postgres major version.
major_version = 15

[studio]
enabled = true
port = 54323

# Local email testing inbox (Inbucket) — catches signup/reset emails during
# `supabase start` so you don't need a real mail provider locally.
[inbucket]
enabled = true
port = 54324

[auth]
enabled = true
# The base URL of your app; used by auth redirects locally.
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173", "http://localhost:5173/reset-password"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[auth.email]
enable_signup = true
# For a smooth local first-run, don't require email confirmation.
enable_confirmations = false

[realtime]
enabled = true
